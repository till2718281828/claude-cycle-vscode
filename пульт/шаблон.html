<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монитор проектов</title>
<!-- Браузерный монитор: собрать.py вставляет пульт.css, пульт.js и данные. Логики здесь нет — она в пульт.js. -->
<style>html, body { margin: 0; background: #1f1f1f; } @media (prefers-color-scheme: light) { html, body { background: #ffffff; } }
body { padding: 12px 16px; }</style>
<style>/*CSS*/</style></head>
<body><div class="pult" id="pult"></div>
<script id="pult-data" type="application/json">/*DATA*/</script>
<script>/*JS*/</script>
<script>Pult.mount(document.getElementById('pult'), JSON.parse(document.getElementById('pult-data').textContent), Pult.browserHost());</script>
</body></html>
