name: Release

# Тег vX.Y.Z → релиз с .vsix. Версия тега должна совпадать с version в package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Версия тега = версия package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Тесты
        run: npm test
      - name: Тесты сборщика монитора
        run: pip install pytest && python -m pytest пульт -q
      - name: Сборка .vsix
        run: npm run package
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
