<svg viewBox="0 0 1260 372" role="img" aria-label="Демо-пример СтальКонструкт-Демо, закрытие месяца по репозиториям: справочники, снимок месяца, сборка P&amp;L, слепой пересчёт с возвратом расхождений, выпуск CFO, замечания и корректировки с повторной проверкой, закрытие выпуска с правилами для отчёта и проверки на следующий месяц." xmlns="http://www.w3.org/2000/svg">
  <!-- Демо-пример на вымышленной компании; правится руками. Цвета — CSS-переменные вкладки (extension.js). -->
  <defs>
    <marker id="ph" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker>
    <marker id="pha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
    <marker id="phs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--stop)"/></marker>
  </defs>
  <!-- дорожки = репозитории -->
  <rect x="0" y="40" width="1260" height="64" fill="var(--lane)"/>
  <rect x="0" y="104" width="1260" height="64" fill="var(--surface)"/>
  <rect x="0" y="168" width="1260" height="64" fill="var(--accent-soft)"/>
  <rect x="0" y="232" width="1260" height="64" fill="var(--check-soft)"/>
  <rect x="0" y="296" width="1260" height="64" fill="var(--lane)"/>
  <g stroke="var(--line)" stroke-width="1">
    <line x1="0" y1="104" x2="1260" y2="104"/><line x1="0" y1="168" x2="1260" y2="168"/><line x1="0" y1="232" x2="1260" y2="232"/>
    <line x1="0" y1="296" x2="1260" y2="296"/><line x1="150" y1="40" x2="150" y2="360"/>
  </g>
  <g fill="var(--ink)" font-size="13" font-weight="600">
    <text x="12" y="70">Справочники</text>
    <text x="12" y="134">Снимки учёта</text>
    <text x="12" y="198">Отчёт CFO</text>
    <text x="12" y="262">Проверка</text>
    <text x="12" y="326">Замечания</text>
  </g>
  <g fill="var(--muted)" font-size="10.5" class="mono">
    <text x="12" y="86">nsi</text>
    <text x="12" y="150">ledger-snapshots</text>
    <text x="12" y="214">reporting</text>
    <text x="12" y="278">verifier</text>
    <text x="12" y="342">review-notes</text>
  </g>
  <g fill="var(--muted)" font-size="11" font-weight="600" letter-spacing=".06em" text-anchor="middle">
    <text x="227" y="24">1 · ОТКРЫТИЕ</text><text x="382" y="24">2 · СНИМОК</text><text x="537" y="24">3 · СБОРКА</text><text x="692" y="24">4 · ПРОВЕРКА</text>
    <text x="847" y="24">5 · ВЫПУСК</text><text x="1002" y="24">6 · ЗАМЕЧАНИЯ</text><text x="1157" y="24">7 · ЗАКРЫТИЕ</text>
  </g>

  <!-- стрелки -->
  <g fill="none" stroke="var(--ink)" stroke-width="1.5">
    <path d="M227 96 V192 H465" marker-end="url(#ph)"/>
    <path d="M450 136 H537 V172" marker-end="url(#ph)"/>
    <path d="M420 160 V256 H620" marker-end="url(#ph)"/>
    <path d="M605 200 H692 V236" marker-end="url(#ph)"/>
    <path d="M760 256 H800 V228" marker-end="url(#ph)"/>
    <path d="M890 224 V328 H930" marker-end="url(#ph)"/>
    <path d="M960 224 V270 H764" marker-end="url(#ph)"/>
    <path d="M1070 328 H1085" marker-end="url(#ph)"/>
  </g>
  <path d="M624 274 H590 V228" fill="none" stroke="var(--stop)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#phs)"/>
  <path d="M1002 304 V228" fill="none" stroke="var(--stop)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#phs)"/>
  <g fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="2 4">
    <path d="M1225 328 H1245 V60 H580 V172" marker-end="url(#pha)"/>
    <path d="M740 60 V236" marker-end="url(#pha)"/>
  </g>
  <g font-size="11" fill="var(--muted)">
    <text x="233" y="160">маппинг</text>
    <text x="458" y="130">снимок</text>
    <text x="426" y="250">те же снимки</text>
    <text x="611" y="194">черновик</text>
    <text x="583" y="290" text-anchor="end" fill="var(--stop)">расхождение</text>
    <text x="806" y="246">0 расхождений</text>
    <text x="898" y="286">снова на проверку</text>
    <text x="1008" y="252" fill="var(--stop)">правки</text>
    <text x="912" y="54" text-anchor="middle" fill="var(--accent)">правила — в чек-лист отчёта и в проверку следующего месяца</text>
  </g>

  <!-- узлы -->
  <g font-size="13" text-anchor="middle">
    <rect x="159" y="48" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="227" y="68" font-weight="600" fill="var(--ink)">Справочники</text>
    <text x="227" y="86" font-size="11" fill="var(--muted)">статьи, маппинг</text>

    <rect x="314" y="112" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="382" y="132" font-weight="600" fill="var(--ink)">Снимок месяца</text>
    <text x="382" y="150" font-size="11" fill="var(--muted)">проводки + SHA-256</text>

    <rect x="469" y="176" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="537" y="196" font-weight="600" fill="var(--ink)">Сборка P&amp;L</text>
    <text x="537" y="214" font-size="11" fill="var(--muted)">контроли, реестр</text>

    <rect x="624" y="240" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--check)" stroke-width="1.5"/>
    <text x="692" y="260" font-weight="600" fill="var(--check)">Слепой пересчёт</text>
    <text x="692" y="278" font-size="11" fill="var(--muted)">код не читает</text>

    <rect x="779" y="176" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="847" y="196" font-weight="600" fill="var(--accent)">Выпуск</text>
    <text x="847" y="214" font-size="11" fill="var(--muted)">HTML + Excel</text>

    <rect x="934" y="176" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="1002" y="196" font-weight="600" fill="var(--accent)">Корректировки</text>
    <text x="1002" y="214" font-size="11" fill="var(--muted)">по тому же плану</text>

    <rect x="934" y="304" width="136" height="48" rx="5" fill="var(--surface)" stroke="var(--check)" stroke-width="1.5"/>
    <text x="1002" y="324" font-weight="600" fill="var(--check)">Замечания</text>
    <text x="1002" y="342" font-size="11" fill="var(--muted)">CFO, совет</text>

    <rect x="1089" y="304" width="136" height="48" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="1157" y="324" font-weight="600" fill="var(--accent)">Закрыть выпуск</text>
    <text x="1157" y="342" font-size="11" fill="var(--ink)">замечание → правило</text>
  </g>
</svg>
